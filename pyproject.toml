[project]
name = "kamaji"
version = "0.1"
description = "Simulation for multi-agent dynamics."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Johnathan Corbin", email = "jcorbin33@gatech.edu"}
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "sympy",
    "qpsolvers",
    "cvxopt",
    "pandas",
    "h5py",
    "networkx",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
rl = [
    "gymnasium",
    "stable-baselines3",
]
gui = [
    "dearpygui",
    "pyqtgraph",
]
doc = [
    "mkdocs",
    "mkdocstrings[python]",
    "pymdown-extensions",
]
dev = [
    "pytest",
    "numba",
]

[build-system]
requires = ["setuptools", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"

[tool.setuptools.packages.find]
include = ["kamaji*"]
